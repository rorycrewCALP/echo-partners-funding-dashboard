name: Refresh ECHO data

on:
  schedule:
    - cron: "17 6 3 * *"   # 06:17 UTC on the 3rd of every month
  workflow_dispatch: {}    # run by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull ECHO grants and HIP budgets
        run: python scripts/refresh.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Refresh ECHO data $(date -u +%Y-%m-%d)"
          git push
